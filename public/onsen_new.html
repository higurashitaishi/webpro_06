<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>新規登録</title>
</head>
<body>
    <h2>温泉の新規登録</h2>
    <form action="/onsen" method="POST">
        <label for="code">所在地:</label><br>
        <input type="text" id="place" name="place" required><br><br>
        <label for="name">温泉名:</label><br>
        <input type="text" id="name" name="name" required><br><br>
        <label for="text">温度:</label><br>
        <input type="text" id="degree" name="degree"><br><br>
        <input type="submit" value="登録"> </form>
    <br>
    <a href="/onsen">一覧に戻る</a>
</body>
</html>
